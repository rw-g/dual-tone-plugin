<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--muted:#6b7280;--line:#e6e8ec;--soft:#f1f3f6;--accent:#3b6df0;--accent-ink:#fff;--ok:#16a06a;--bad:#d6453d;--warn:#b57a00;--stage:#dfe3ea;--track:#dfe3ea;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.10);--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1013;--panel:#161a20;--ink:#e9ebef;--muted:#8d97a6;--line:#262b34;--soft:#1d222a;--accent:#6b95ff;--accent-ink:#0b1020;--ok:#3ccb87;--bad:#ff6b61;--warn:#f0b429;--stage:#1b1f27;--track:#303744;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1013;--panel:#161a20;--ink:#e9ebef;--muted:#8d97a6;--line:#262b34;--soft:#1d222a;--accent:#6b95ff;--accent-ink:#0b1020;--ok:#3ccb87;--bad:#ff6b61;--warn:#f0b429;--stage:#1b1f27;--track:#303744;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:1fr 336px;height:100%;transition:grid-template-columns .2s}#app.nopanel{grid-template-columns:1fr 0}#app.nopanel aside{visibility:hidden}
@media(max-width:820px){#app,#app.nopanel{grid-template-columns:1fr;grid-template-rows:52% 48%}#app.nopanel{grid-template-rows:1fr 0}}
#stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden;background-image:linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%),linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#view{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#view.drag{cursor:grabbing}#view.split{cursor:col-resize}
.bar{position:absolute;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.bar>*{pointer-events:auto}#bar-l{left:12px;top:12px;right:96px}#view.crop{cursor:crosshair}#bar-r{right:12px;top:12px}
.grp{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--ink);background:none;border:0;border-radius:7px;min-height:28px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
button:hover{background:var(--soft)}button:active{transform:translateY(.5px)}button.on,button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}button:disabled{opacity:.45;cursor:default}
button.ic{width:30px;padding:0;justify-content:center}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
#msg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .2s;font-variant-numeric:tabular-nums}#msg.err{background:var(--bad);color:#fff}#msg[hidden]{display:block;opacity:0}
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:none;align-items:center;justify-content:center;font-weight:600;color:var(--accent);pointer-events:none}#stage.over #drop{display:flex}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}#empty[hidden]{display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}h1{font-size:14px;font-weight:650;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--muted);font-size:12px;margin-top:1px}
#chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--soft);color:var(--muted)}.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
#scroll{flex:1;overflow:auto;padding:4px 0}
details.sec{border-bottom:1px solid var(--line)}details.sec>summary{list-style:none;cursor:pointer;padding:11px 16px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}details.sec[open]>summary::after{transform:rotate(45deg)}
.body{padding:0 16px 14px;display:grid;gap:10px}
select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit}select{height:30px;padding:0 8px}textarea{padding:7px 9px;resize:vertical;min-height:84px}
.ctl{display:grid;grid-template-columns:92px 1fr 62px;gap:8px;align-items:center}.ctl>label{color:var(--muted)}.ctl.sel{grid-template-columns:92px 1fr}
input[type=number]{width:100%;height:26px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-5px;box-shadow:0 1px 3px rgba(0,0,0,.25)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}.check input{accent-color:var(--accent);margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}.note{color:var(--muted);font-size:12px}.note.warn{color:var(--warn)}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}.seg button{flex:1;justify-content:center;color:var(--muted)}.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.ghost{border:1px solid var(--line)}.ghost:hover{border-color:var(--accent)}
.gh{font-size:11px;color:var(--muted);font-weight:600;margin:6px 0 -2px}
#presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pre{width:100%;min-width:0;overflow:hidden;align-self:start;display:grid;gap:3px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--soft);text-align:left;min-height:0;height:auto;align-items:stretch}.pre canvas{width:100%;aspect-ratio:4/3;border-radius:5px;display:block;background:#fff}.pre span{font-size:11px;line-height:1.15;color:var(--ink);padding:0 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pre.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--panel)}
.primary{background:var(--accent);color:var(--accent-ink);justify-content:center;min-height:34px;font-weight:600}.primary:hover{background:var(--accent);filter:brightness(1.08)}.secondary{justify-content:center;min-height:34px;border:1px solid var(--line);font-weight:550}
#tip{position:fixed;z-index:60;max-width:260px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .12s}#tip.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100% - 24px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.45)}dialog .in{padding:18px;display:grid;gap:12px}dialog h2{margin:0;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
<symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
<symbol id="i-fliph" viewBox="0 0 24 24"><path d="M12 3v18M8 7L3 12l5 5zM16 7l5 5-5 5z"/></symbol>
<symbol id="i-flipv" viewBox="0 0 24 24"><path d="M3 12h18M7 8l5-5 5 5zM7 16l5 5 5-5z"/></symbol>
<symbol id="i-rot" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h3"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
</defs></svg>
<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Halftone preview"></canvas>
    <div id="empty" hidden><svg class="i" style="width:36px;height:36px"><use href="#i-open"/></svg><div>Drop an image here, paste one, or press Open</div></div>
    <div id="drop">Drop to load image</div>
    <div class="bar" id="bar-l">
      <div class="grp">
        <button id="open" data-tip="Open an image (or drop / paste one onto the page)."><svg class="i"><use href="#i-open"/></svg>Open</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="grp" role="toolbar" aria-label="History">
        <button class="ic" id="undo" data-tip="Undo the last settings change (Ctrl/Cmd+Z)" aria-label="Undo" disabled><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="ic" id="redo" data-tip="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo" disabled><svg class="i"><use href="#i-redo"/></svg></button>
        <button class="ic" id="link" data-tip="Copy a link that restores these settings (use it with the same image)." aria-label="Copy settings link"><svg class="i"><use href="#i-link"/></svg></button>
      </div>
      <div class="grp" role="toolbar" aria-label="Image">
        <button class="ic" id="flipx" data-tip="Flip left-right" aria-label="Flip horizontally"><svg class="i"><use href="#i-fliph"/></svg></button>
        <button class="ic" id="flipy" data-tip="Flip top-bottom" aria-label="Flip vertically"><svg class="i"><use href="#i-flipv"/></svg></button>
        <button class="ic" id="rotcw" data-tip="Rotate 90° clockwise" aria-label="Rotate"><svg class="i"><use href="#i-rot"/></svg></button>
        <button class="ic" id="cropbtn" data-tip="Crop: drag a rectangle on the image to keep only that part (Esc cancels)." aria-label="Crop" aria-pressed="false"><svg class="i"><use href="#i-crop"/></svg></button>
        <button id="imgreset" data-tip="Undo all crop / flip / rotate">Reset image</button>
      </div>
      <div class="grp" role="toolbar" aria-label="Compare">
        <button data-cmp="split" class="on" data-tip="Split view: drag the divider to compare original and halftone. (1)">Split</button>
        <button data-cmp="ht" data-tip="Halftone only. (2)">Halftone</button>
        <button data-cmp="orig" data-tip="Original only. (3)">Original</button>
      </div>
      <div class="grp" role="toolbar" aria-label="Zoom">
        <button class="ic" id="zout" data-tip="Zoom out (-)" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
        <button id="zfit" data-tip="Fit to window (0). Double-click the image also fits.">Fit</button>
        <button id="z100" data-tip="Actual pixels, 100% (9)">100%</button>
        <button class="ic" id="zin" data-tip="Zoom in (+). Mouse wheel zooms at the cursor; drag to pan." aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="bar" id="bar-r"><div class="grp">
      <button class="ic" id="theme" data-tip="Switch light / dark theme" aria-label="Theme"><svg class="i"><use href="#i-sun"/></svg></button>
      <button class="ic" id="panelbtn" data-tip="Show / hide the side panel (H)" aria-label="Toggle panel"><svg class="i"><use href="#i-panel"/></svg></button>
    </div></div>
    <div id="msg" hidden></div>
  </div>
  <aside>
    <div id="head"><h1 id="ttl">Halftone</h1><div class="sub" id="sub"></div><div id="chips"></div></div>
    <div id="scroll">
      <details class="sec" open><summary>Presets</summary><div class="body" id="presets"></div></details>
      <details class="sec" open><summary>Tone</summary><div class="body">
        <div class="ctl" data-tip="Lighten or darken the whole image before halftoning."><label for="brightness">Brightness</label><input id="brightness" type="range" min="-1" max="1" step="0.01" value="0" data-def="0"><input id="brightnessn" type="number" min="-1" max="1" step="0.01" value="0"></div>
        <div class="ctl" data-tip="Spread tones apart (positive) or squeeze them together (negative). Halftones usually like a little extra contrast."><label for="contrast">Contrast</label><input id="contrast" type="range" min="-100" max="100" step="1" value="0" data-def="0"><input id="contrastn" type="number" min="-100" max="100" step="1" value="0"></div>
        <div class="ctl" data-tip="Midtone brightness. Above 1 lightens midtones, below 1 darkens them."><label for="gamma">Gamma</label><input id="gamma" type="range" min="0.2" max="3" step="0.01" value="1" data-def="1"><input id="gamman" type="number" min="0.2" max="3" step="0.01" value="1"></div>
        <div class="ctl" data-tip="Blur radius in pixels. Smooths noise and tiny detail so dots stay clean."><label for="blur">Smooth</label><input id="blur" type="range" min="0" max="12" step="1" value="0" data-def="0"><input id="blurn" type="number" min="0" max="12" step="1" value="0"></div>
        <div class="ctl" data-tip="Unsharp mask: boosts edges so features survive the loss of tone."><label for="sharpen">Sharpen</label><input id="sharpen" type="range" min="0" max="3" step="0.05" value="0" data-def="0"><input id="sharpenn" type="number" min="0" max="3" step="0.05" value="0"></div>
        <label class="check" data-tip="Auto-levels: stretch the lightest and darkest 0.5% of the image to pure white and black. Helps flat, hazy photos."><input type="checkbox" id="normalize">Auto-levels</label>
        <div class="ctl" data-tip="Black point: tones at or below this level become black."><label for="bp">Black point</label><input id="bp" type="range" min="0" max="0.9" step="0.01" value="0" data-def="0"><input id="bpn" type="number" min="0" max="0.9" step="0.01" value="0"></div>
        <div class="ctl" data-tip="White point: tones at or above this level become white."><label for="wp">White point</label><input id="wp" type="range" min="0.1" max="1" step="0.01" value="1" data-def="1"><input id="wpn" type="number" min="0.1" max="1" step="0.01" value="1"></div>
        <div class="ctl" data-tip="Wave: repeat the tone ramp so shades band like contour lines (sawtooth restarts, triangle mirrors). Repeat count on the right."><label for="wave">Wave</label><select id="wave" style="grid-column:2"><option value="none">None</option><option value="saw">Sawtooth</option><option value="tri">Triangle</option></select><input id="waveN" type="number" min="1" max="12" step="1" value="3"></div>
        <label class="check" data-tip="Swap light and dark before halftoning (negative image)."><input type="checkbox" id="invert">Invert tones</label>
        <label class="check" data-tip="Dither in linear light so the share of ink matches how bright the area looks. Often lightens midtones."><input type="checkbox" id="linear">Linear-light</label>
      </div></details>
      <details class="sec" open><summary>Method</summary><div class="body">
        <select id="method" aria-label="Method"></select>
        <div id="mparams" class="body" style="padding:0"></div>
      </div></details>
      <details class="sec" open><summary>Output</summary><div class="body">
        <div class="ctl" data-tip="Width of the black-and-white image in pixels (height follows the aspect ratio). 600-1200 px suits most 3D textures."><label for="width">Width px</label><input id="width" type="range" min="128" max="2048" step="8" value="800" data-def="800"><input id="widthn" type="number" min="64" max="4096" step="8" value="800"></div>
        <label class="check" data-tip="Swap black and white in the result (ink becomes paper)."><input type="checkbox" id="outinv">Invert result</label>
      </div></details>
      <details class="sec"><summary>Original request</summary><div class="body"><textarea id="prompt" spellcheck="false" aria-label="Original request" data-tip="The request that started this. It is sent with the image when you press Apply."></textarea></div></details>
    </div>
    <div id="foot">
      <button class="primary" id="apply" data-tip="Send this black-and-white image with your original request to the 3D skill, which applies it to the model and opens the 3D viewer."><svg class="i"><use href="#i-cube"/></svg>Apply to 3D model</button>
      <div class="row"><select id="escale" aria-label="Export scale" style="width:64px" data-tip="Export size: repeats every pixel 1 to 4 times so edges stay sharp when the PNG is placed on a large face."><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select><button class="secondary" id="dl" style="flex:1" data-tip="Download the result as a 1-bit black-and-white PNG."><svg class="i"><use href="#i-down"/></svg>Download PNG</button><button class="ghost secondary" id="reset" data-tip="Reset all controls to the current preset."><svg class="i"><use href="#i-reset"/></svg></button></div>
    </div>
  </aside>
</div>
<dialog id="dlg"><div class="in"><h2>Apply to 3D model</h2><div class="note" id="dlgnote"></div><textarea id="dlgprompt" spellcheck="false" aria-label="Prompt to send"></textarea>
  <div class="row sp"><button class="ghost secondary" id="dlgcopy">Copy prompt</button><button class="ghost secondary" id="dlgdl">Download PNG again</button><button class="primary" id="dlgclose" style="padding:0 18px">Done</button></div></div></dialog>
<div id="tip" role="tooltip"></div>
<script>__ENGINE__</script>
<script>
(function () {
'use strict';
var E = window.HalftoneEngine, PRESETS = __PRESETS__, META = __META__, IMAGE = "__IMAGE__";
var $ = function (s) { return document.querySelector(s); };
var UI = {
  am: { label: 'Halftone screen (dots / lines)', params: [
    { k: 'grid', l: 'Grid', type: 'select', opts: E.GRIDS, def: 'square', rebuild: true, tip: 'Where the marks sit. Square and hex are lattices at an angle; radial puts dots on concentric rings (sunburst); ring makes continuous concentric lines.' },
    { k: 'cell', l: 'Cell size', min: 2, max: 40, step: 0.5, def: 6, tip: 'Distance between dot centres in output pixels. Bigger cells = coarser, more visible dots.' },
    { k: 'angle', l: 'Angle', min: -90, max: 90, step: 1, def: 45, tip: 'Screen angle in degrees. 45 is the classic print angle; 0 gives rows and columns.' },
    { k: 'shape', l: 'Shape', type: 'select', opts: E.SHAPES, def: 'round', when: function (p) { return p.grid !== 'ring'; }, tip: 'Dot shape. Line gives engraving-style lines whose thickness follows tone.' },

$('#apply').onclick = applyToModel;
$('#dlgcopy').onclick = function () { var t = $('#dlgprompt'); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ } if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(function () { say('Prompt copied'); }, function () { if (ok) say('Prompt copied'); }); else if (ok) say('Prompt copied'); };
$('#dlgdl').onclick = async function () { save(await makePng(), outName()); }; $('#dlgclose').onclick = function () { $('#dlg').close(); };

// ---- wiring

$('#flipx').onclick = function () { pushOp({ t: 'flipx' }); }; $('#flipy').onclick = function () { pushOp({ t: 'flipy' }); }; $('#rotcw').onclick = function () { pushOp({ t: 'rot' }); }; $('#imgreset').onclick = function () { commitNow(); setOps([]); commitNow(); }; $('#cropbtn').onclick = function () { setCrop(!S.cropOn); };
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#link').onclick = function () { clearTimeout(hist.t); if (!hist.cur) hist.cur = snapshot(); if (!writeHash()) { say('This page cannot create a link here.', true); return; } var u = location.href; if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { say('Settings link copied'); }, function () { say('Link is in the address bar'); }); else say('Link is in the address bar'); };
TONE_KEYS.forEach(function (k) {
  var r = $('#' + k), n = $('#' + k + 'n'); r.oninput = function () { n.value = r.value; paintRange(r); S.preset = null; markPreset(); schedule(); }; n.oninput = function () { if (isFinite(+n.value)) { r.value = n.value; paintRange(r); S.preset = null; markPreset(); schedule(); } }; r.ondblclick = function () { r.value = n.value = r.dataset.def; paintRange(r); schedule(); };
});
['invert', 'linear', 'outinv', 'normalize'].forEach(function (k) { $('#' + k).onchange = function () { if (k !== 'outinv') { S.preset = null; markPreset(); } schedule(); }; });
$('#wave').onchange = function () { S.preset = null; markPreset(); schedule(); }; $('#waveN').oninput = function () { S.preset = null; markPreset(); schedule(); }; $('#escale').onchange = function () { commitSoon(); };
$('#width').oninput = function () { setWidth(+$('#width').value); schedule(); fit(); }; $('#widthn').onchange = function () { setWidth(+$('#widthn').value); schedule(); fit(); }; $('#width').ondblclick = function () { setWidth(+$('#width').dataset.def); schedule(); fit(); };
$('#reset').onclick = function () { var p = PRESETS.filter(function (q) { return q.id === (S.preset || META.preset || 'newsprint'); })[0] || PRESETS[0]; applyPreset(p); say('Reset to ' + p.name); };

$('#zin').onclick = function () { zoomAt(1.25); }; $('#zout').onclick = function () { zoomAt(0.8); }; $('#zfit').onclick = fit; $('#z100').onclick = function () { zoomAt(1 / S.zoom * (S.dpr ? 1 : 1)); };
