<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#14171c;--muted:#6b7280;--line:#e6e8ec;--soft:#f1f3f6;--accent:#3b6df0;--accent-ink:#fff;--ok:#16a06a;--bad:#d6453d;--warn:#b57a00;--stage:#dfe3ea;--track:#dfe3ea;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.10);--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1013;--panel:#161a20;--ink:#e9ebef;--muted:#8d97a6;--line:#262b34;--soft:#1d222a;--accent:#6b95ff;--accent-ink:#0b1020;--ok:#3ccb87;--bad:#ff6b61;--warn:#f0b429;--stage:#1b1f27;--track:#303744;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1013;--panel:#161a20;--ink:#e9ebef;--muted:#8d97a6;--line:#262b34;--soft:#1d222a;--accent:#6b95ff;--accent-ink:#0b1020;--ok:#3ccb87;--bad:#ff6b61;--warn:#f0b429;--stage:#1b1f27;--track:#303744;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:1fr 316px;height:100%;transition:grid-template-columns .2s}#app.nopanel{grid-template-columns:1fr 0}#app.nopanel aside{visibility:hidden}
@media(max-width:820px){#app,#app.nopanel{grid-template-columns:1fr;grid-template-rows:58% 42%}#app.nopanel{grid-template-rows:1fr 0}}
#stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden}#stage canvas{display:block;width:100%;height:100%;touch-action:none}
/* floating toolbars */
.bar{position:absolute;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.bar>*{pointer-events:auto}#bar-l{left:12px;top:12px;right:56px}#bar-r{right:12px;top:12px}
.grp{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;box-shadow:var(--shadow)}
button{font:inherit;color:var(--ink);background:none;border:0;border-radius:7px;min-height:28px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
button:hover{background:var(--soft)}button:active{transform:translateY(.5px)}button.on,button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}button:disabled{opacity:.4;cursor:default}
button.ic{width:30px;padding:0;justify-content:center}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
#msg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .2s}#msg.err{background:var(--bad);color:#fff}#msg[hidden]{display:block;opacity:0}
#ring{position:absolute;pointer-events:none;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:50%;transform:translate(-50%,-50%);left:-100px;top:-100px}
#hint{position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:11px;pointer-events:none}
/* side panel */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}h1{font-size:14px;font-weight:650;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--muted);font-size:12px;margin-top:1px}
#pf{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
#scroll{flex:1;overflow:auto;padding:4px 0}
details.sec{border-bottom:1px solid var(--line)}details.sec>summary{list-style:none;cursor:pointer;padding:11px 16px;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}details.sec[open]>summary::after{transform:rotate(45deg)}
.body{padding:0 16px 14px;display:grid;gap:10px}
#texdd{position:relative}#texbtn{width:100%;justify-content:space-between;height:34px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:0 8px 0 6px;overflow:hidden}#texbtn .nm{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}#texbtn::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);flex:none}
#texlist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;max-height:280px;overflow:auto}#texlist[hidden]{display:none}
.titem{display:flex;align-items:center;gap:6px;border-radius:7px;padding:3px 3px 3px 4px}.titem:hover,.titem.sel{background:var(--soft)}.titem .pick{flex:1;min-width:0;padding:0;gap:8px;background:none!important;min-height:30px}.titem .pick span{overflow:hidden;text-overflow:ellipsis}.titem .pick small{color:var(--muted);display:block;font-size:11px}.titem button.ic{width:26px;min-height:26px}
.thumb{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:#fff center/cover;image-rendering:pixelated;flex:none}.titem.add{border-top:1px solid var(--line);margin-top:3px;border-radius:0 0 7px 7px}.titem.add .pick{color:var(--accent);font-weight:600}
button.rm{color:var(--bad)}button.rm:hover{background:color-mix(in srgb,var(--bad) 16%,transparent)}
select{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}.seg label{flex:1;text-align:center;border-radius:6px;padding:4px 6px;cursor:pointer;color:var(--muted);font-weight:550;position:relative}.seg label:hover{color:var(--ink)}.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}.seg label:has(input:checked){background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}.seg label:has(input:focus-visible){outline:2px solid var(--accent)}.seg button{flex:1;justify-content:center;color:var(--muted)}.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.ctl{display:grid;grid-template-columns:84px 1fr 62px;gap:8px;align-items:center}.ctl>label{color:var(--muted)}
input[type=number]{width:100%;height:26px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-5px;box-shadow:0 1px 3px rgba(0,0,0,.25)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);cursor:pointer}.check input{accent-color:var(--accent);margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line)}.ghost:hover{border-color:var(--accent)}
#uvbox{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
#foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px;background:var(--panel)}
.primary{background:var(--accent);color:var(--accent-ink);justify-content:center;min-height:34px;font-weight:600;position:relative}.primary:hover{background:var(--accent);filter:brightness(1.08)}.primary.dirty::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#ffb020}
.note{color:var(--muted);font-size:12px}pre{white-space:pre-wrap;font-size:11px;background:var(--soft);padding:8px;border-radius:7px;max-height:180px;overflow:auto;margin:0}
#tip{position:fixed;z-index:50;max-width:260px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .12s}#tip.show{opacity:1}
kbd{font:11px ui-monospace,monospace;background:rgba(127,127,127,.25);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2.2"/><path d="M5 8.5C6.5 4 12 2.5 12 2.5"/></symbol>
<symbol id="i-paint" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-8.5 8.5-5.2.8.8-5.2z"/><path d="M4 21c1.6-.2 2.6-1 3-2.2"/></symbol>
<symbol id="i-flood" viewBox="0 0 24 24"><path d="M6 11l6-6.5 7 7-6.5 6.5z"/><path d="M5 11h14"/><path d="M20.5 15.5c1 1.4 1.5 2.3 1.5 3a1.5 1.5 0 0 1-3 0c0-.7.5-1.6 1.5-3z"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h3"/></symbol>
<symbol id="i-wire" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
</defs></svg>
<div id="app">
  <div id="stage">
    <div class="bar" id="bar-l">
      <div class="grp" role="toolbar" aria-label="Selection tools">
        <button class="on" data-tool="orbit" data-tip="Orbit: drag to rotate, right-drag to pan, wheel to zoom. Also lets you use the projection gimbal. (O)"><svg class="i"><use href="#i-orbit"/></svg>Orbit</button>
        <button data-tool="paint" data-tip="Paint: drag a circle brush over the model to add or remove every triangle the circle touches. Mode is set in the Triangles section. ([ ] change size) (P)"><svg class="i"><use href="#i-paint"/></svg>Paint</button>
        <button data-tool="flood" data-tip="Flood: click a triangle to select connected triangles whose normal is within the Flood angle of the clicked one. (F)"><svg class="i"><use href="#i-flood"/></svg>Flood</button>
        <span class="sep"></span>
        <button class="ic" id="undo" data-tip="Undo selection change (Ctrl/Cmd+Z)" aria-label="Undo" disabled><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="ic" id="redo" data-tip="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo" disabled><svg class="i"><use href="#i-redo"/></svg></button>
      </div>
      <div class="grp" role="toolbar" aria-label="View">
        <button data-v="iso" data-tip="Isometric view (1)">Iso</button><button data-v="front" data-tip="Front view, looking along +Y (2)">Front</button><button data-v="top" data-tip="Top view (3)">Top</button><button data-v="right" data-tip="Right view (4)">Right</button>
        <span class="sep"></span>
        <button class="ic" id="fitview" data-tip="Frame the whole model" aria-label="Frame model"><svg class="i"><use href="#i-fit"/></svg></button>
        <button class="ic" id="wire" data-tip="Wireframe (W)" aria-label="Wireframe" aria-pressed="false"><svg class="i"><use href="#i-wire"/></svg></button>
      </div>
    </div>
    <div class="bar" id="bar-r"><div class="grp">
      <button class="ic" id="theme" data-tip="Switch light / dark theme" aria-label="Theme"><svg class="i"><use href="#i-sun"/></svg></button>
      <button class="ic" id="panelbtn" data-tip="Show / hide the side panel (H)" aria-label="Toggle panel"><svg class="i"><use href="#i-panel"/></svg></button>
    </div></div>
    <div id="ring" hidden></div>
    <div id="msg" hidden>Loading model…</div>
  </div>
  <aside>
    <div id="head"><h1 id="ttl"></h1><div class="sub" id="sub"></div><div id="pf"></div></div>
    <div id="scroll">
      <div id="notex" class="note" style="padding:14px 16px" hidden>No image textures in this model, so there is no UV map to adjust.</div>
      <div id="uvpanel" hidden>
        <details class="sec" open><summary>Texture</summary><div class="body">
          <select id="texsel" aria-label="Texture" hidden></select>
          <div id="texdd"><button id="texbtn" aria-haspopup="listbox" aria-expanded="false" data-tip="Choose which texture to adjust. Each texture keeps its own selection, projection and transform. Swap or remove a texture, or add another, from the list."></button><div id="texlist" role="listbox" hidden></div></div>
          <input type="file" id="texfile" accept="image/*" hidden>
          <div class="note" id="texempty" hidden>No textures on this part. Choose Add New to upload one.</div>
          <div class="row sp" id="texrow"><span class="count" id="selcount"></span><button class="ghost" id="reset" data-tip="Reset this texture: triangle selection, projection and transform."><svg class="i"><use href="#i-reset"/></svg>Reset</button></div>
        </div></details>
        <div id="texdep">
        <details class="sec" open><summary>Triangles</summary><div class="body">
          <div class="seg" data-tip="What Paint and Flood do: give triangles this texture (Add), or take it away (Remove). Removed triangles become white, or go back to their original non-texture material; they never fall back to another texture. Added triangles need UVs, so a Planar projection is switched on. (X toggles)">
            <label><input type="radio" name="pmode" value="add" checked>Add</label><label><input type="radio" name="pmode" value="rem">Remove</label></div>
          <div class="ctl" data-tip="Paint brush radius in pixels. ([ and ] change it)"><label for="bsize">Brush</label><input id="bsize" type="range" min="4" max="200" step="1" value="30" data-def="30"><input id="bsizen" type="number" min="1" max="400" step="1" value="30"></div>
          <div class="ctl" data-tip="Flood selects connected triangles whose normal differs from the clicked triangle's normal by at most this angle."><label for="fang">Flood angle</label><input id="fang" type="range" min="0" max="180" step="1" value="20" data-def="20"><input id="fangn" type="number" min="0" max="180" step="1" value="20"></div>
          <label class="check" data-tip="Paint only triangles that face the camera. Triangles hidden behind other parts are not detected."><input type="checkbox" id="front" checked>Front-facing only</label>
          <label class="check" data-tip="Tint the triangles that use this texture so the selection is easy to see."><input type="checkbox" id="hl">Highlight selection</label>
          <button class="ghost" id="selclear" style="justify-content:center;width:100%" data-tip="Clear this texture from every triangle that uses it so you can start fresh, then use Paint or Flood to add it back where you want it. The triangles become white; other textures are not touched. (Undo brings it back.)"><svg class="i"><use href="#i-reset"/></svg>Clear texture from all triangles</button>
          <div class="row"><button class="ghost" id="selreset" data-tip="Go back to the triangles the file assigned to this texture">Reset selection</button></div>
        </div></details>
        <details class="sec" open><summary>Projection</summary><div class="body">
          <select id="proj" aria-label="Projection" data-tip="Re-map the UVs of the selected triangles from a projector you can move in the viewport. Keep file UVs leaves the file's own coordinates alone.">
            <option value="keep">Keep file UVs</option><option value="planar">Planar (orthographic)</option><option value="cylindrical">Cylindrical</option><option value="spherical">Spherical</option><option value="box">Box</option></select>
          <div id="gimbal" hidden><div class="row"><div class="seg" style="flex:1"><button data-gm="translate" data-tip="Move the projector">Move</button><button class="on" data-gm="rotate" data-tip="Rotate the projector">Rotate</button><button data-gm="scale" data-tip="Scale the projector">Scale</button></div><button class="ic ghost" id="gfit" data-tip="Fit the projector to the model" aria-label="Fit projector"><svg class="i"><use href="#i-fit"/></svg></button></div>
          <span id="gnote" hidden></span></div>
        </div></details>
        <details class="sec" open><summary>Transform</summary><div class="body">
          <div class="ctl" data-tip="Turns the picture counter-clockwise (seen from outside) about the texture centre. Double-click the slider to reset."><label for="rot">Rotate °</label><input id="rot" type="range" min="-180" max="180" step="0.5" value="0" data-def="0"><input id="rotn" type="number" min="-180" max="180" step="0.5" value="0"></div>
          <div class="ctl" data-tip="Moves the picture toward +u (right). Double-click to reset."><label for="du">Shift u</label><input id="du" type="range" min="-0.5" max="0.5" step="0.005" value="0" data-def="0"><input id="dun" type="number" min="-0.5" max="0.5" step="0.005" value="0"></div>
          <div class="ctl" data-tip="Moves the picture toward +v (up). Double-click to reset."><label for="dv">Shift v</label><input id="dv" type="range" min="-0.5" max="0.5" step="0.005" value="0" data-def="0"><input id="dvn" type="number" min="-0.5" max="0.5" step="0.005" value="0"></div>
          <div class="ctl" data-tip="Texture size on the surface: 2 = twice as large. The slider stops at 3; type a larger number for more. 0 is treated as 0.01. Double-click to reset."><label for="scale">Scale</label><input id="scale" type="range" min="0" max="3" step="0.01" value="1" data-def="1"><input id="scalen" type="number" min="0" step="0.01" value="1"></div>
        </div></details>
        <details class="sec"><summary>UV preview</summary><div class="body">
          <canvas id="uvbox" width="300" height="300" aria-label="UV layout preview" data-tip="The texture image with the UV triangles (blue) in the texture space the surface samples from."></canvas>
        </div></details>
        </div>
      </div>
      <details class="sec" id="checks" hidden><summary>Model checks</summary><div class="body"><pre id="pftxt"></pre></div></details>
    </div>
    <div id="foot">
      <button class="primary" id="dl" data-tip="Save a new 3MF with your triangle selection, projection and transform baked into the UV coordinates."><svg class="i"><use href="#i-down"/></svg>Download adjusted 3MF</button>
      <div class="row sp"><button class="ghost" id="resetall" data-tip="Reset every texture: selection, projection and transform."><svg class="i"><use href="#i-reset"/></svg>Reset all</button><span class="note" id="dlmsg"></span></div>
    </div>
  </aside>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
'use strict';
const META = __META__;
const MODEL_B64 = "__MODEL__";
const { THREE, OrbitControls, TransformControls, ThreeMFLoader, fflate } = window.V3;
const $ = s => document.querySelector(s);
const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const zipBytes = b64(MODEL_B64);
$('#ttl').textContent = META.title; $('#sub').textContent = META.filename + ' · ' + META.triangles.toLocaleString() + ' triangles';
